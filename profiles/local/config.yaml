# Local profile: run in the current allocation instead of submitting jobs.
#
# Deliberately NOT named "default": Snakemake 8 auto-loads a profile called `default` as the
# workflow profile, which would silently override the cluster profile. For dry runs, the smoke
# target, --touch, and debugging one cell. The development server has two cores and 4 GB, so
# nothing heavier than the smoke tests and the gathers belongs here.
#
#   snakemake --profile profiles/local -j 2 <target>

jobs: 2
latency-wait: 15
keep-going: False
rerun-incomplete: True
printshellcmds: True
use-conda: True
conda-frontend: conda
resources:
  - llm_qwen3_5_9b=1
  - llm_gemma_4_12b=1
  - llm_qwen3_8_27b_fp8=1
  - llm_gemma_4_31b=1
  - zenodo=1
rerun-triggers:
  - mtime
  - input
  - software-env
  - code
