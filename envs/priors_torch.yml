# The torch tier: FEATURES (ImageNet ResNet-18 features) and TRAIN (arm E, ResNet-18 from
# scratch). Torch enters here and not before. The CUDA 12.4 wheel also runs on CPU nodes (it falls
# back when no device is visible), so one environment serves the CPU features jobs and the GPU
# training jobs; the rules request a GPU through SLURM only when the stage's config switch says so.
# Palmetto2's A100 / V100 / H100 nodes all carry drivers new enough for cu124. medmnist comes
# from envs/priors_torch.post-deploy.sh for the same reason as in priors.yml.
name: priors_torch
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy>=2
  - scipy>=1.14
  - pandas>=2
  - scikit-learn>=1.5
  - pyyaml
  - pytest
  - pillow
  - pip
  - pip:
      - --index-url https://download.pytorch.org/whl/cu124
      - torch>=2.4
      - torchvision>=0.19
