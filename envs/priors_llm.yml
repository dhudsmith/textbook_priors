# The LLM client tier: SCORE and the probe. The openai package against the RCD service, pillow to
# encode the 224-pixel images as PNG data URLs, numpy and pyyaml to read the sample and the bank.
# Its own file, so a client upgrade never invalidates the numpy or torch tiers (WORKFLOW.md
# section 7).
name: priors_llm
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy>=2
  - pyyaml
  - pillow
  - openai>=1.40
