# The pinned MedMNIST v2 release, as the workflow reads it.
#
# Not a set of knobs: this file DESCRIBES the fixed input of WORKFLOW.md section 4 - the six
# 224-pixel release files that were downloaded, checksummed and set aside before the workflow
# existed. Rules take it as an INPUT file, not as a configfile, so a change to a label map
# reruns the prompts and everything below them.
#
# Every value below was read from the `medmnist` package (version 3.0.2, PyPI wheel
# medmnist-3.0.2-py3-none-any.whl) rather than retyped: `label`, `task` and `n_samples` come
# verbatim from `medmnist.INFO[<dataset>]`, and `md5_224` from its `MD5_224`. `size_bytes` is
# the size of the file on disk under storage_root/raw. The `smoke` target holds this file to
# the installed package and to the concept bank's class names, so a package upgrade that moved
# a label map fails loudly instead of quietly rewriting a prompt.
#
# `label` keys are the integer class indices of the release; their ORDER is the order every
# arm's scores, every zero-shot distribution and every AUC column use.

medmnist_version: "3.0.2"
zenodo_record: 10519652          # the pinned release record; provenance, never re-fetched
size: 224                        # the only resolution the talk version uses

datasets:
  pathmnist:
    file: pathmnist_224.npz
    md5_224: 2c51a510bcdc9cf8ddb2af93af1eadec
    size_bytes: 12629854322
    medmnist_task: "multi-class"
    n_channels: 3
    n_samples:
      train: 89996
      val: 10004
      test: 7180
    label:
      0: "adipose"
      1: "background"
      2: "debris"
      3: "lymphocytes"
      4: "mucus"
