# The pinned MedMNIST v2 release (WORKFLOW.md section 5, principle 3).
#
# Zenodo record 10519652 (MedMNIST v2, data version 3), file names and MD5 checksums exactly as the
# medmnist package (version below) records them in medmnist.INFO, plus the task string, channel
# count, split sizes and label map the workflow reads for every dataset. Generated once from the
# package and committed; tests/test_bank.py asserts that the installed package still agrees, so a
# package upgrade that moved a file or a checksum fails the smoke test instead of fetching
# something else. scripts/fetch_medmnist.sh downloads by these names and verifies these MD5s.
