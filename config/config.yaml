# Configuration for the textbook-priors workflow (WORKFLOW.md section 8).
#
# Every grid, seed, model list and knob lives here, so a number in results/ traces to a line in this
# file plus the seed recorded in its manifest. The Snakefile only expands these lists. Resources sit
# at the bottom; they are not a rerun trigger (the values a rule's numbers depend on reach it as
# params), so a memory edit reruns nothing.

outdir: results
# Large data lives on the project filesystem (not purged, unlike /scratch); data/raw and data/cache
# are symlinks into it, made by scripts/link_storage.sh from the fetch and cache rules.
storage_root: /project/dane2/wficai/textbook_priors
rawdir: data/raw              # -> <storage_root>/raw: the 24 MedMNIST release files, ~40 GB
cachedir: data/cache          # -> <storage_root>/cache: uint8 .npy per split, ~50 GB at 224; gitignored
conceptdir: data/concepts     # the bank: twelve committed, cited files (CONCEPT_BANK.md)
figdir: report/figs
tabdir: report/tables
release: config/medmnist.yaml     # the pinned Zenodo record: file names, MD5s, sizes, split sizes, label maps
# Zenodo serves ~105 KB/s per connection (2026-09-09), so a file is fetched as parallel byte ranges:
# one per segment_mb, at most max_segments. Each job holds `segments` units of the profile's zenodo
# resource, which caps the connections open to the record at once.
fetch: {segment_mb: 256, max_segments: 24}
published: config/published.yaml  # the MedMNIST v2 ResNet-18 rows arm E is reconciled against

datasets: [pathmnist, chestmnist, dermamnist, octmnist, pneumoniamnist, retinamnist,
           breastmnist, bloodmnist, tissuemnist, organamnist, organcmnist, organsmnist]
# chestmnist is multi-label: a nearest fingerprint (arm B) and a distribution over class names
# (arm A) are not defined over fourteen co-occurring findings (section 2, section 10). It stays in
# arms C, P and E, and only the primary model scores it, since the ladder is arm B alone.
arm_b_exclude: [chestmnist]
# The order of the n_B figure: modalities grouped, so "where the textbook pays" reads across them.
modality_order: [pathmnist, tissuemnist, bloodmnist, dermamnist, retinamnist, octmnist,
                 breastmnist, pneumoniamnist, chestmnist, organamnist, organcmnist, organsmnist]

size: 224                     # every arm sees this
recon_sizes: [28, 224]        # TRAIN only; the two sizes with published ResNet-18 numbers
# Both capped at the official split size; breastmnist (156 test, 546 train) and retinamnist
# (400, 1080) are the two that cap. The pool is drawn from the official train split only.
sample: {test_n: 500, pool_n: 2000, seed: 0}
# Curve points above a dataset's pool are dropped, not repeated (section 4).
curve: {n: [50, 100, 200, 500, 1000, 2000], seeds: [0, 1, 2]}

vlm:
  primary: qwen3.8-27b-fp8
  # concurrency: the service's published limit per model; cap: the number of chunk jobs this
  # workflow runs at once for that model (one call in flight per job), which is also the value of
  # the llm_<model> resource in profiles/palmetto/config.yaml (tests/test_config.py holds the two
  # equal). splits: what the model scores; only the primary scores the labelled pool (section 4).
  models:
    qwen3.5-9b:      {family: qwen,  params_b: 9,  concurrency: 128, cap: 96, splits: [test]}
    gemma-4-12b:     {family: gemma, params_b: 12, concurrency: 32,  cap: 24, splits: [test]}
    qwen3.8-27b-fp8: {family: qwen,  params_b: 27, concurrency: 64,  cap: 48, splits: [test, pool]}
    gemma-4-31b:     {family: gemma, params_b: 31, concurrency: 16,  cap: 12, splits: [test]}
  chunk: 100                  # images per scoring job; one JSON per chunk in the archive
  prompts: [concept, zeroshot]  # separate calls on separate prompts; zeroshot only for vlm.primary
  # Clinical names where the label map is not clinical (section 2): retinamnist's keys are the
  # digit strings "0".."4" of the international diabetic-retinopathy severity scale.
  zeroshot_names:
    retinamnist:
      "0": no diabetic retinopathy
      "1": mild non-proliferative diabetic retinopathy
      "2": moderate non-proliferative diabetic retinopathy
      "3": severe non-proliferative diabetic retinopathy
      "4": proliferative diabetic retinopathy
  prompt: {anchors: true}     # render each scale level's anchor text; false = bare level tokens
  temperature: 0.0
  reasoning: none             # fixed, not swept (section 10); recorded in every score manifest
  # How `reasoning: none` reaches the server. The service is OpenAI-compatible; vLLM-style
  # deployments read chat_template_kwargs.enable_thinking. The ten-image probe (rule probe) is
  # where this is confirmed against the live service; change it there, not after the fan-out.
  reasoning_extra_body: {chat_template_kwargs: {enable_thinking: false}}
  json_mode: json_object      # response_format type; null sends none and relies on the parser
  max_tokens: 600             # twelve concept answers are ~150 tokens; a class distribution fewer
  retries: 1                  # retries on a malformed answer, then recorded as missing, never guessed
  http_retries: 8             # attempts on 429 / 5xx / connection errors, exponential backoff
  backoff_s: 2.0              # first backoff; doubles each attempt, with jitter, capped at 120 s
  timeout_s: 180
  base_url: https://llm.rcd.clemson.edu/v1
  key_file: ~/.config/rcd_llm/key   # owner-only; never in config, the repository, a command line or a log
  # The opt-in probe (WORKFLOW.md section 9, step 4): n images of one dataset on the primary model,
  # written under results/score_probe/ so a truncated chunk never sits in the archive as complete.
  probe: {dataset: pathmnist, n: 10}

features:
  arch: resnet18
  weights: imagenet1k_v1      # torchvision ResNet18_Weights.IMAGENET1K_V1
  layer: penultimate          # the 512-d global-average-pooled features before fc
  batch: 64
  # At most 2,500 images per dataset through a ResNet-18 forward pass: ~2 minutes on four CPU cores
  # (estimate from the network's 1.8 GFLOP per image at 224; measure in benchmarks/features/). A GPU
  # allocation would spend more time in the queue than the job takes, so the switch is off; flip it
  # if the benchmark says otherwise.
  gpu: {enabled: false, type: a100, cpus: 4, mem_mb: 16000, runtime: 60}

classify:
  l2_grid: [0.01, 0.1, 1, 10, 100]   # L2 strengths; sklearn's C is their reciprocal
  l2_default: 1                      # used when a subset cannot be cross-validated (a class of one)
  cv_folds: 5                        # reduced to min(5, smallest class count) in a subset
  missing_max_frac: 0.05             # the section 7 completeness gate on a dataset-model cell
  permute: {seeds: [0, 1, 2]}        # the H2 controls; seeded per cell, like every other draw

evaluate:
  bootstrap: 10000                   # paired resamples of the test sample
  ci: 0.95

ladder:                              # H3: the 4-model x 11-dataset repeated-measures design
  factors: [family, size_tier]       # crossed: qwen {9, 27}, gemma {12, 31}
  block: dataset                     # AUCs are not commensurable across datasets; block, never pool
  trend: log10_params                # the planned 1-df linear contrast, which is what H3 asserts
  friedman: true                     # distribution-free check with Nemenyi post-hoc
  alpha: 0.05

train:
  arch: resnet18
  pretrained: false
  epochs: 100
  batch: 128
  lr: 0.001
  milestones: [50, 75]               # the published recipe: x0.1 after epochs 50 and 75
  gamma: 0.1
  select_on: val_auc
  seeds: [0, 1, 2]
  amp: false                         # fp32, as published; bf16 autocast is one flag away
  deterministic: false               # cudnn.deterministic costs ~30% and the manifest records it
  save_weights: false                # predictions are what downstream reads; weights are large
  # One A100 per job. Memory is set per dataset in the Snakefile from the cached array size (the
  # job holds every split of the dataset in RAM as uint8); these are the floor and the runtime.
  gpu: {enabled: true, type: a100, cpus: 8, mem_mb: 16000, runtime: 480}

reconcile: {tol_auc: 0.02, tol_acc: 0.03}   # |arm E seed mean - published| within these is "agrees"

# Resources per rule. cpus is also `threads`; mem_mb per job; runtime in minutes.
#
# First guesses until benchmarks/ exists, then set from the measured peaks with the reasoning in a
# comment. Ask of every rule: does the code use more than one core (a sequential HTTP loop does
# not; LR fits with lbfgs use a few), and how wide is its fan-out against the profile's `cores`?
resources:
  fetch:     {cpus: 1, mem_mb: 2000,  runtime: 600}   # curl: network-bound; the 224 files are up to ~10 GB
  cache:     {cpus: 2, mem_mb: 4000,  runtime: 120}   # streamed npz -> npy; memory does not scale with the dataset
  score:     {cpus: 1, mem_mb: 2000,  runtime: 90}    # one HTTP call in flight; 100 images at ~10 s each
  probe:     {cpus: 1, mem_mb: 2000,  runtime: 30}
  features:  {cpus: 4, mem_mb: 16000, runtime: 60}    # CPU fallback of the features stage (see features.gpu)
  smoke_torch: {cpus: 2, mem_mb: 2000, runtime: 15}   # measured 2026-09-09: 956 MB peak, 53 s (benchmarks/smoke_torch.tsv)
  classify:  {cpus: 4, mem_mb: 8000,  runtime: 180}   # ~2,300 small LR fits per dataset; lbfgs uses a few cores
  evaluate:  {cpus: 2, mem_mb: 8000,  runtime: 120}   # 10,000 bootstrap resamples over ~40 score matrices
  summary:   {cpus: 1, mem_mb: 4000,  runtime: 20}
  reconcile: {cpus: 1, mem_mb: 4000,  runtime: 20}
  report:    {cpus: 2, mem_mb: 8000,  runtime: 30}
  paper:     {cpus: 1, mem_mb: 4000,  runtime: 20}
