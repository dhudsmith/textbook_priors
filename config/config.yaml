# Configuration for the textbook-priors workflow.
#
# Every grid, seed and cap lives here, so a number in results/ traces to a line in this file plus
# the seed in its manifest. The Snakefile only expands these lists. WORKFLOW.md section 8 is the
# plan's version of this file; sections arrive here as the stages that read them are implemented,
# so that no key in this file is unread by a rule.
#
# Resources sit at the bottom. They are not a rerun trigger - the values a rule's numbers depend
# on reach it as `params` - so editing a memory request reruns nothing.

outdir: results
figdir: report/figs
tabdir: report/tables

# The fixed inputs of WORKFLOW.md section 4, all completed before the workflow and never
# refetched: the concept bank (committed), the pinned release description, and the published
# literature benchmarks (read as input files by the rules that need them, not as configfiles).
conceptdir: data/concepts
release: config/medmnist.yaml
literature: data/literature/benchmarks.yaml

# The project filesystem, which is not purged: the raw releases sit under <storage_root>/raw and
# the sampled arrays under <storage_root>/cache. `data/raw` and `data/cache` are symlinks onto it,
# made once by scripts/link_storage.sh and gitignored - a symlink is not a computation, and the
# releases are prior work no rule fetches (WORKFLOW.md section 4).
storage_root: /project/dane2/wficai/textbook_priors
rawdir: data/raw
cachedir: data/cache/sample

# One dataset per modality: histology, dermoscopy, OCT, chest X-ray, blood smear, CT.
datasets: [pathmnist, dermamnist, octmnist, pneumoniamnist, bloodmnist, organamnist]
size: 224                          # what the VLM sees and what the ImageNet encoder wants

# The two samples every arm is measured on. One seed for both, so the whole study is paired: every
# arm and every model predicts on the same 500 test images, and the curve's largest point is a
# prefix of the same 2000-image labelled pool. Every dataset has at least 624 test and 4708 train
# images, which the smoke tier checks against the pinned split sizes.
sample: {test_n: 500, pool_n: 2000, seed: 0}

# The learning curve: how many labelled images arms C and P get, and at how many draws of them.
# The resolution of n_B - the headline number, the smallest n at which the pixel probe reaches the
# zero-label textbook arm - is this grid and nothing finer.
curve:  {n: [50, 100, 200, 500, 1000, 2000], seeds: [0, 1, 2]}

vlm:
  # Both prompts are pure functions of the concept bank and the label map, rendered by their own
  # rule (stage 2) rather than inline in the scoring loop.
  prompt:
    anchors: true                  # render each level's cited anchor text; false is the
                                   # `bare_levels` extension of WORKFLOW.md section 10

  primary: qwen3.8-27b-fp8         # the only model that scores the labelled pool, and the only
                                   # one asked the zero-shot prompt (arm A)
  models:                          # concurrency as the service publishes it, cap ours below it;
                                   # `splits` is what each model scores, since arm B needs no labels
                                   #
                                   # The primary model's cap came down from 48 to 24 on 2026-09-12.
                                   # Measured: one stream costs 4.5 s per call and 48 streams cost
                                   # 89 s each, so aggregate throughput rose only 2.5-fold for 48
                                   # times the concurrency - a nearly saturated endpoint. On such an
                                   # endpoint halving the streams costs little throughput and halves
                                   # how long a chunk takes, and a chunk that overruns its time limit
                                   # loses every call it made. Reliability is worth more here than
                                   # the last few percent of rate.
    qwen3.5-9b:      {family: qwen,  params_b: 9,  concurrency: 128, cap: 96, splits: [test]}
    gemma-4-12b:     {family: gemma, params_b: 12, concurrency: 32,  cap: 24, splits: [test]}
    qwen3.8-27b-fp8: {family: qwen,  params_b: 27, concurrency: 64,  cap: 24, splits: [test, pool]}
    gemma-4-31b:     {family: gemma, params_b: 31, concurrency: 16,  cap: 12, splits: [test]}

  # H4's readers (WORKFLOW.md section 2). A *reader* is a model plus a reasoning effort, and the
  # four models above are readers at effort `none`. These two are the new ones. Each scores the
  # concept prompt on a 200-image prefix of the same seeded test sample, which is why every
  # existing reader joins the comparison for nothing: a prefix of a random sample is a random
  # sample, so the four archives above are subset rather than re-bought.
  #
  # 200 is measured, not chosen for roundness: below it organamnist's rarest class empties and its
  # AUC column stops existing (6 of 11 classes reach five images at 100, 10 at 150, all 11 at 200).
  # dermamnist stays thin either way and carries the caveat it already carries at 500.
  #
  # Both run at `medium`, the same effort, so H4b compares capability and not how hard each model
  # was asked to think. `medium` is what both advertise and costs the primary model the same
  # completion tokens as `low` (986 against 982, measured 2026-09-12).
  readers:
    qwen3.8-27b-fp8-medium:                 # H4a: the primary model, asked to think
      model: qwen3.8-27b-fp8
      effort: medium
      api: local
      cap: 12                               # the endpoint saturates; this is politeness, not rate
      max_tokens: 2048                      # 512 is what made thinking look impossible: at medium
                                            # the answer costs about 986 completion tokens
      subsample: 200
    gpt-5.6-terra-medium:                   # H4b: a frontier closed model, asked to think as hard
      model: gpt-5.6-terra
      effort: medium
      api: gateway                          # max_completion_tokens, not max_tokens
      service_tier: flex                    # the documented 50% discount; accepted on chat calls
      temperature: null                     # this model REFUSES temperature 0 - only its default
                                            # is allowed - so it is the one reader in the study
                                            # that is not deterministic. Stated as a limit on H4b
                                            # in WORKFLOW.md section 2, not worked around.
      cap: 12
      max_tokens: 4096
      subsample: 200

  base_url: https://llm.rcd.clemson.edu/v1
  key_file: ~/.config/rcd_llm/key  # owner-only; read by priors/llm.py and nowhere else
  temperature: 0.0
  reasoning: none                  # sent as chat_template_kwargs.enable_thinking: false, because
                                   # with reasoning on the primary model spends the whole budget in
                                   # reasoning_content and returns nothing
  max_tokens: 512                  # enough for twelve concepts of JSON; the one content retry
                                   # doubles it, which is the repair for a truncated reply
  retries: 1                       # content retries on a malformed answer, then recorded missing
  transport_retries: 4             # separate: 429 and 5xx, with exponential backoff
  timeout: 120                     # seconds per call
  chunk: 100                       # images per scoring job

  # The opt-in probe of WORKFLOW.md section 9, step 3: ten images through the whole path on a
  # compute node, plus one deliberately truncated call to show a malformed answer is recorded
  # missing rather than guessed. Outside `rule all`.
  probe: {n: 10, malformed_max_tokens: 1}

# Arm P's encoder. Frozen, never trained, and its weights are a fixed input like every other: they
# sit under <storage_root>/torch_home so a compute node needs no internet and every run uses the
# same bytes. The batch is a memory knob, not a result.
features: {arch: resnet18, weights: imagenet1k_v1, batch: 64}
featuredir: data/cache/features
torch_home: /project/dane2/wficai/textbook_priors/torch_home

# The classifier grid is stage 4's; `missing_max_frac` is read one stage earlier, by the gather
# that flags a dataset-model cell too incomplete for the headline (WORKFLOW.md section 3).
classify: {l2_grid: [0.01, 0.1, 1, 10, 100], cv_folds: 5, missing_max_frac: 0.05, permute: {seeds: [0, 1, 2]},
           probe: {folds: 5, seed: 0}}    # H4's readout-free measure: arm C's classifier fitted by
                                          # cross-validation inside the scored images themselves, so
                                          # it needs no labelled pool and every reader can have one

# The bootstrap resamples the 500 test images, not the labelled subsets: it is the test sample's
# sampling error that every arm shares, and sharing it is what makes the differences paired.
# h3_min_wins is descriptive at 5 of 6 (p = 0.11), which six datasets cannot improve on.
evaluate: {bootstrap: 10000, ci: 0.95, seed: 0, h3_min_wins: 5}

# H4's chain, fixed here before a single call of it was bought (WORKFLOW.md section 2). Each step
# changes exactly one thing: baseline to thinking holds the model and changes the effort; thinking
# to frontier holds the effort and changes the model. `gpt-5.6-terra` cannot be asked for no
# reasoning at all, which is why the frontier reader is compared against a thinking primary rather
# than against the archive's thinking-off one.
h4:
  baseline: qwen3.8-27b-fp8               # already in the archive, at effort none
  thinking: qwen3.8-27b-fp8-medium
  frontier: gpt-5.6-terra-medium
  subsample: 200                          # the shared prefix every reader in the chain is read on
  min_wins: 6                             # supported on 6 of 6 (p = 0.016), as H1 and H2 are

# Resources per rule. cpus is also `threads`; mem_mb per job; runtime in minutes.
#
# First guesses until benchmarks/ exists, then set from the measured peaks with the reasoning in a
# comment. render_prompts and smoke are localrules (seconds of yaml, string formatting and tests,
# no LLM calls), so they ask for nothing.
resources:
  # Measured on 2026-09-11 over all six datasets (benchmarks/sample/). One core: mean load came out
  # at 0.27 to 0.79 of a core, because inflating a zip member is single-threaded and the copy loop
  # is sequential, so a second core would only spin. Peak RSS 133-398 MB, the top of it being
  # pathmnist's 376 MB sample array itself plus inflate buffers, so 1500 MB is a little under four
  # times the peak and leaves room for a wider sample; the first guess of 4000 was blocking node
  # packing for nothing. Wall time 19 s to 126 s - pathmnist inflates 13.5 GB in one pass at about
  # 100 MB/s - so 20 minutes is ten times the longest run and covers a contended filesystem.
  sample: {cpus: 1, mem_mb: 1500, runtime: 20}
  # H4's two readers, 200 images each in two chunks of 100. The local one thinks, which costs about
  # 986 completion tokens against 112 with thinking off; at the ~63 tokens/s aggregate this endpoint
  # delivers, a chunk of 100 is a little over half an hour and 240 minutes is the same four-times
  # headroom the thinking-off chunks get. The gateway one is somebody else's capacity and answered
  # in 3 to 9 s a call when measured, so 60 minutes is generous. Memory is one dataset's test array.
  score_reader: {cpus: 1, mem_mb: 2000, runtime: 240}
  score_reader_gateway: {cpus: 1, mem_mb: 2000, runtime: 60}
  # Guess. The probe is 21 calls placed one after another and a few PNG encodings: one core, and
  # memory is one dataset's test array held while the images are encoded (376 MB at the widest).
  # Thirty minutes is for the service being slow, not for the work.
  probe:  {cpus: 1, mem_mb: 2000, runtime: 30}
  # One core: the job waits on the network rather than computing. Memory is the split's image array
  # held while each image is encoded, 376 MB at the widest, so 2 GB.
  #
  # Runtime was 30 minutes, from the probe's median of 3.6 s per call at concurrency ONE, and 29
  # jobs of the first fan-out died on it. Per-call latency is not a property of the service alone:
  # measured across that run, gemma-4-12b under a cap of 24 took 3.4 s and finished a chunk in 6
  # minutes, gemma-4-31b under a cap of 12 took 5.0 s and 8 to 11 minutes, while the primary model
  # under a cap of 48 ran past 30 minutes for a hundred images. A chunk that times out throws away
  # every call it made, which is the expensive failure here, so the request is now four times the
  # worst chunk seen rather than twice the best. Then 120 was not enough either: measured at 00:15
  # on 2026-09-12, a single call to the primary model while 48 of our own jobs were in flight took
  # 89 s, against 4.5 s to the same model with nothing else running. Per-call latency on that model
  # is dominated by contention, ours and other users', so a chunk of 100 can need two and a half
  # hours. 240 minutes is what a chunk costs at the worst rate observed, plus room.
  score:  {cpus: 1, mem_mb: 2000, runtime: 240}
  # Guess. ResNet-18 over 2500 images is small, but torch's matmuls do use the cores they are
  # given, so four; memory is the float NCHW batch (64 x 3 x 224 x 224 is 38 MB) plus the split's
  # images and the 5 MB of features, so 8 GB is generous and will be cut from the benchmarks.
  features: {cpus: 4, mem_mb: 8000, runtime: 60}
  # Guess. The work is 36 logistic-regression fits per arm per dataset plus their cross-validation,
  # the widest at 2000 images by 512 features; sklearn's lbfgs uses the cores it is given, so four.
  # Memory is those matrices and the fifty score matrices, all small, so 8 GB is generous.
  classify: {cpus: 4, mem_mb: 8000, runtime: 120}
  # Guess. The bootstrap is 10,000 ranked resamples of a 500-row matrix with a column per arm and
  # class; one core, since it is one numpy loop, and the arrays are megabytes.
  evaluate: {cpus: 2, mem_mb: 4000, runtime: 60}
  report: {cpus: 2, mem_mb: 4000, runtime: 30}        # matplotlib over a few hundred numbers
  report_pdf: {cpus: 1, mem_mb: 4000, runtime: 20}
