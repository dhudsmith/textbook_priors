# Published benchmark numbers for the twelve MedMNIST v2 2D tasks this study uses.
#
# A fixed input, like the concept bank and the pinned release (WORKFLOW.md section 4): completed
# before the workflow reads it, and no rule re-derives or re-runs any of these numbers. They enter
# the report as a citable reconciliation point, not as a comparison arm — every value here is
# FULLY SUPERVISED, trained on each dataset's whole official training split (thousands to tens of
# thousands of images: WORKFLOW.md section 4's table), not on this study's n<=2000 labelled pool.
#
# Source: Yang, J., Shi, R., Wei, D., Liu, Z., Zhao, L., Ke, B., Pfister, H. & Ni, B. "MedMNIST v2 -
# A large-scale lightweight benchmark for 2D and 3D biomedical image classification." Scientific
# Data 10, 41 (2023). doi:10.1038/s41597-022-01721-8. Table 3, the "ResNet-18 (224)" row (the same
# input resolution this study uses) plus the four rows beside it for completeness. `citation` below
# is the `yang2023` key already in `report/references.bib` — the same paper the concept bank cites
# as its anchor for every dataset (data/concepts/*.yaml), reused rather than duplicated.
#
# Transcribed by hand from the published PDF (arXiv:2110.14795, section "Benchmark on Each
# Dataset", Table 3) on 2026-09-12, and cross-checked twice against the table text before being
# committed: once value-by-value against the extracted PDF text, once by re-deriving each dataset's
# five-method row from the paper's own average-AUC table (Table 5) as a sanity check that no row
# had been shifted. Every method the paper reports for MedMNIST2D is kept, not only the winner, so
# a reader can see the range rather than a single cherry-picked number: ResNet-18 (224) and
# ResNet-50 (224), the two backbones trained under the paper's own protocol; auto-sklearn and
# AutoKeras, the two open-source AutoML baselines; and Google AutoML Vision, the commercial one.
#
# organamnist here is OrganAMNIST — the axial-view organ dataset — matching config/medmnist.yaml's
# `organamnist` (labels bladder, femur-left, ...), not OrganMNIST3D, which the paper's own section
# "Difference between Organ{A,C,S}MNIST and OrganMNIST3D" says must not be compared to it; the
# same holds for organcmnist and organsmnist, the coronal and sagittal views.

