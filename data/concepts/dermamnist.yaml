# Concept bank: dermamnist (MedMNIST v2), 2026-09-09
#
# Seven-class dermatoscopic dataset derived from HAM10000. Concepts are dermoscopic
# structures drawn from the ABCD rule, the seven-point checklist, and the Consensus Net
# Meeting / International Society of Dermoscopy standardised terminology, restricted to
# structures that survive a 224-pixel crop with no scale bar, no second view and no history.
#
# Deliberate omissions:
#   - Diameter (the "D" of the clinical ABCDE) is NOT a concept: a dermatoscopic crop
#     carries no reliable scale, so absolute size cannot be judged from the image.
#   - Fine vessel morphology beyond coarse arborizing vessels (dotted, glomerular, hairpin,
#     linear-irregular) is NOT a concept: at 224 pixels these are at or below the limit of
#     what is resolvable.
#   - Ulceration is NOT a concept: at this resolution an eroded basal cell carcinoma and the
#     haemorrhagic crust of a vascular lesion are not reliably distinguishable, so the
#     feature would not discriminate.
#
# The rule used for committing a fingerprint level:
#   A class commits a level on a concept only where the source reports that feature in a
#   MAJORITY of that class's lesions, or where the feature is DEFINITIONAL - part of the
#   scored criteria of a named algorithm (the ABCD rule, the seven-point checklist, the
#   two-step algorithm) or of the entity's definition. A feature that is highly specific but
#   seen in a minority ("characteristic when present", such as spoke-wheel areas in basal
#   cell carcinoma) is set to `any` for that class. Such a feature is not wasted: it stays
#   `absent` on every class that genuinely lacks it, so it remains a one-sided cue and a
#   usable regressor, without the file asserting something untrue about the class that owns
#   it. Where a class lumps sub-entities that disagree, `any` is likewise the honest value
#   and the reason is stated in that class's comment.

dataset: dermamnist
modality: 3-channel colour dermatoscopic images of pigmented skin lesions
task: multi-class
medmnist_task: "multi-class"
source_dataset: HAM10000 (Tschandl et al. 2018)

provenance:
