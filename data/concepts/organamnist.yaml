# Concept bank for organamnist (MedMNIST v2), written 2026-09-09.
# PLANE: AXIAL. The images are 2D bounding-box crops around a single organ taken
# from abdominal CT volumes in the axial plane.
#
# THIS CONCEPT SET IS SHARED, VERBATIM, WITH organamnist.yaml, organcmnist.yaml and
# organsmnist.yaml. The `concepts:` block below (ids, questions, scales, source keys) is
# byte-identical in all three files; only `modality:` and the `classes:` fingerprints differ,
# because a plane changes which anatomical axes are visible in a crop:
#   axial    - left/right and anterior/posterior are readable; cranio-caudal level is inferred
#              from the surrounding structures caught in the crop.
#   coronal  - left/right and cranio-caudal are readable; anterior/posterior is NOT, so
#              `anteroposterior_position` is `any` for every class in organcmnist.yaml.
#   sagittal - anterior/posterior and cranio-caudal are readable; patient left versus right is
#              NOT, so `body_side` is `any` for every lateralised class in organsmnist.yaml.
# Cranio-caudal level is committed here from context: rib cage and dark lung
# versus mid-abdominal bowel and vertebra versus pelvic bone.
#
# RADIOLOGICAL CONVENTION: in axial and coronal CT the patient's LEFT appears on the RIGHT of
# the image. `body_side` is therefore asked and answered in PATIENT terms, and the question
# says so explicitly, so that a viewer who reads the image left-to-right is not silently
# scored as wrong.
#
# CAVEAT on attenuation: the LiTS volumes are largely PORTAL-VENOUS-PHASE contrast-enhanced CT,
# and MedMNIST maps Hounsfield units through a fixed abdominal window. The attenuation
# fingerprints are derived for THAT phase: enhanced renal parenchyma and the enhanced cardiac
# blood pool are among the brightest soft-tissue structures in the frame, spleen is roughly
# isodense to liver rather than darker than it, and the bladder stays dark because contrast
# reaches it only in the much later excretory phase. Phase is not perfectly uniform across LiTS,
# so only coarse, phase-robust contrasts are committed and no absolute HU value is asserted.
# CAVEAT on size: every image is a tight bounding box around one organ, so the organ fills the
# frame by construction. `relative_size` is therefore asked against the apparent scale of the
# landmarks caught at the crop edge, not against the frame.
#
# SOURCING RULE APPLIED HERE: a source is cited for a fingerprint only if it supports the claim
# under THIS dataset's imaging conditions, not in general. Attenuation is therefore taken from
# contrast-phase references (Bae 2010; Sheth & Fishman 2004) and not from unenhanced-CT norms.
# An earlier draft used Piekarski 1980 - unenhanced liver-minus-spleen CT numbers - to make the
# spleen darker than the liver, which is wrong for a portal-venous dataset; that source has been
# removed from this file rather than re-purposed.
#
# CAVEAT on the liver class: LiTS is a liver-tumour cohort, so many liver crops contain focal
# lesions. `interior_homogeneity: homogeneous` for liver is the textbook expectation of normal
# parenchyma, not a prediction about this cohort.
#
# KNOWN LIMITATION - shape and size versus the MedMNIST resize:
# MedMNIST v2 crops 2D images from the centre slices of the 3D organ bounding boxes and resizes
# them to a square (28x28, and 224x224 in the larger releases); no aspect-ratio handling is
# stated. If that resize is anisotropic, a tight bounding box around an elongated organ is
# stretched toward filling the square and apparent shape and scale are distorted. Exactly two
# concepts are affected:
#   elongation     - pancreas `elongated` (axial and coronal), femur `elongated` (coronal and
#                    sagittal), bladder `round`, and every `oval` value.
#   relative_size  - all eleven classes.
# This is not answerable from the literature and has deliberately not been guessed at here; it
# stands as a documented limitation of those two concepts. The `relative_size` anchors are
# written as counts of landmarks along the crop edge, a cue that survives an anisotropic resize;
# the `elongation` anchors are axis ratios, which do not, and carry a second ratio-free cue.

dataset: organamnist
modality: >-
  1-channel greyscale abdominal CT crops at a fixed abdominal window; each image is a 2D
  bounding-box crop around one organ taken from a CT volume in the axial plane
task: multi-class
medmnist_task: "multi-class"
source_dataset: >-
  Liver Tumor Segmentation Benchmark, LiTS (Bilic et al. 2023), with the eleven-organ
  bounding-box annotations of Xu et al. 2019
provenance:
  method: literature review with a web-connected assistant
  assistant: Claude Opus 5 (claude-opus-5), 2026-09-09
  reviewed_by: >-
    simulated review by Claude Opus 5 (claude-opus-5), 2026-09-09; no clinician has
    reviewed this file
  sources:
    - key: yang2023
      citation: >-
        Yang J, Shi R, Wei D, Liu Z, Zhao L, Ke B, Pfister H, Ni B. MedMNIST v2 - A large-scale
        lightweight benchmark for 2D and 3D biomedical image classification. Scientific Data
        2023;10:41.
      doi: 10.1038/s41597-022-01721-8
      used_for: [relative_size]
    - key: bilic2023
      citation: >-
        Bilic P, Christ P, Li HB, et al. The Liver Tumor Segmentation Benchmark (LiTS). Medical
        Image Analysis 2023;84:102680.
      doi: 10.1016/j.media.2022.102680
      used_for: [relative_attenuation, interior_homogeneity]
    - key: xu2019
      citation: >-
        Xu X, Zhou F, Liu B, Fu D, Bai X. Efficient multiple organ localization in CT image using
        3D region proposal network. IEEE Transactions on Medical Imaging 2019;38(8):1885-1898.
      doi: 10.1109/TMI.2019.2894854
      used_for: [relative_size, adjacent_bone]
    - key: moeller2013
      citation: >-
        Moeller TB, Reif E. Pocket Atlas of Sectional Anatomy: Computed Tomography and Magnetic
        Resonance Imaging. Volume II: Thorax, Heart, Abdomen and Pelvis. 4th ed. Stuttgart:
        Thieme; 2013. ISBN 9783131256041.
      url: https://shop.thieme.com/Pocket-Atlas-of-Sectional-Anatomy-Vol.-II-Thorax-Heart-Abdomen-and-Pelvis/9783131256041
      used_for: [body_side, craniocaudal_level, anteroposterior_position, relative_size,
                 elongation, hilar_notch, adjacent_bone]
    - key: spratt2016
      citation: >-
        Spratt JD, Salkowski LR, Loukas M, Turmezei T, Weir J, Abrahams PH. Weir & Abrahams'
        Imaging Atlas of Human Anatomy. 5th ed. Edinburgh: Elsevier; 2016. ISBN 9780723438267.
      url: https://shop.elsevier.com/books/weir-and-abrahams-imaging-atlas-of-human-anatomy/spratt/978-0-7234-3826-7
      used_for: [body_side, craniocaudal_level, anteroposterior_position, elongation,
                 contour_lobulation, hilar_notch, bright_cortical_rim, adjacent_bone]
    - key: denotter2023
      citation: >-
        DenOtter TD, Schubert J. Hounsfield Unit. In: StatPearls. Treasure Island (FL):
        StatPearls Publishing; updated 2023 Mar 6.
      url: https://www.ncbi.nlm.nih.gov/books/NBK547721/
