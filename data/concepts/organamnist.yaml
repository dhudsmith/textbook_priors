    - key: hansell2008
      citation: >-
        Hansell DM, Bankier AA, MacMahon H, McLoud TC, Muller NL, Remy J. Fleischner Society:
        glossary of terms for thoracic imaging. Radiology 2008;246(3):697-722.
      doi: 10.1148/radiol.2462070712
      used_for: [relative_attenuation, interior_homogeneity, boundary_definition]
    - key: bae2010
      citation: >-
        Bae KT. Intravenous contrast medium administration and scan timing at CT: considerations
