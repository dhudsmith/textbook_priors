# Concept bank for chestmnist (MedMNIST v2), built 2026-09-09.
# Frontal chest radiographs, 1-channel greyscale, fourteen findings, multi-label.
#
# IMPORTANT on the labels: the fourteen ChestX-ray14 labels were mined from free-text
# radiology reports by NLP, not assigned by a radiologist looking at each image; Wang et al.
# report precision 0.90 / recall 0.91 / F1 0.90 for that text mining on a validation set.
# The fingerprints below are therefore the textbook's expectation for the *named finding*,
# not a description of the label noise, and not a claim about how often the label is right.
#
# Because the task is multi-label, one image may carry several findings at once and many
# images carry none. Concepts are written at the level of radiographic *signs* so that
# fingerprints share them; `any` marks a sign the finding does not constrain.
#
# KNOWN CEILING: "consolidation" and "pneumonia" carry IDENTICAL fingerprints on purpose.
# Pneumonia is an aetiology, not a radiographic sign; its radiographic manifestation *is*
# consolidation, and the Fleischner glossary gives no plain-film feature that separates the
# two. In ChestX-ray14 both labels were mined from report wording that often describes the
# same film, so no fingerprint over visible signs can distinguish them. Any method that
# matches images to these fingerprints alone will score them alike; that is a property of
# the labels, not a defect of the bank.
#
# Note on `mediastinal_shift_direction`: its scale is a signed axis (pull toward the
# opaque side, no shift, push away from it) rather than a magnitude, because direction is
# what distinguishes volume loss from a space-occupying pleural collection.
#
# THE RULE FOR `any`. A fingerprint commits a class to a level only where a cited source
# supports that level or the level is definitional for the term. It does NOT commit a class
# to the bottom level of a sign the finding simply does not constrain. Zero-filling would be
# wrong in kind here: the task is multi-label, findings co-occur by mechanism (cardiomegaly
# with oedema and effusion, most of all), and an image labelled with two findings is
# correctly labelled with both. A fingerprint that asserted the other finding's signs are
# absent would be asserting the label is wrong. Some fingerprints are therefore thin --
# `cardiomegaly` constrains one sign, `nodule` and `mass` one each -- and that thinness is
# the honest description of what the term means, not a gap to be filled.
#
# Since this block was written, chestmnist has been excluded from arm B entirely (WORKFLOW.md
# §3 and §10): nothing downstream matches images to these fingerprints at all. They stand as
# documentation and as the expected levels when a finding is present, and the concept scores
# still carry this dataset through arms A, C, P and E. The argument below is therefore doubly
# true, and is kept because the failure mode it names is a later audit, not a later reader.
# DO NOT "FIX" THIS FILE BY MAKING THE FINGERPRINTS SEPARATE BETTER. Pairwise separability
# is not a meaningful quality measure for chestmnist. Under a multi-label task the classes
# are not alternatives to choose between: an image showing cardiomegaly and effusion carries
# both labels and is correctly labelled with both, so no method ever has to tell that pair
# apart. The question that matters per class is whether the finding's own signs are
# distinguishable from that finding's absence. An audit that counts concepts on which two
# classes commit to different levels will score this file poorly, and the way to raise that
# score is to assert findings are absent when the sources say nothing of the kind. That
# trade was tried during drafting and reverted; it is a worse file. If a later audit flags
# these pairs, the flag is the thing to discard.

dataset: chestmnist
modality: frontal chest radiographs, single-channel greyscale
task: multi-label
medmnist_task: "multi-label, binary-class"
source_dataset: NIH ChestX-ray14 (Wang et al. 2017)

