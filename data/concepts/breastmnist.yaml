concepts:
  # Gate concept. Definitional for the malignant class. The negative class stays `any`: the
  # literature makes no claim about whether a "normal or benign" breast image contains a mass,
  # and MedMNIST's merge puts both answers in the same class.
  - id: focal_lesion_present
    question: "Is a discrete focal area standing out from the surrounding layered tissue visible?"
    scale: [absent, equivocal, present]
    sources: [yang2023, aldhabyani2020, dorsi2013, mendelson2013, lee2017]
  # BI-RADS shape. Microlobulation is a majority malignant finding (Stavros sensitivity 75.2%),
  # and oval shape is a majority benign finding (Hong NPV 84%), so BOTH classes commit here.
  # `no_focal_area` is the honest bottom level for a lesion-free image; it sits one step below
  # the benign level, keeping normal images nearer the negative fingerprint.
  - id: shape_irregularity
    question: "If a focal area stands out, is its outline oval, gently lobulated, or jagged?"
    scale: [no_focal_area, oval_or_round, gently_lobulated, irregular]
    sources: [stavros1995, mendelson2013, hong2005]
  # BI-RADS margin. The single most sensitive malignant descriptor (angular margins, Stavros
  # sensitivity 83.2%) and the most reliable benign one (circumscribed margin, Hong NPV 90%),
  # so BOTH classes commit. Same `no_focal_area` floor as above.
  - id: margin_circumscription
    question: "If a focal area stands out, is its boundary sharp, blurred, or angular and spiky?"
    scale: [no_focal_area, circumscribed, indistinct, angular_or_spiculated]
    sources: [stavros1995, mendelson2013, hong2005, rao2016]
  # BI-RADS orientation, framed as presence so a lesion-free image answers `absent`. Stavros
  # sensitivity 41.6% but specificity 98.1%: rule-in only, so malignant takes `any`.
  - id: taller_than_wide
    question: "Does any focal area reach deeper below the skin than it measures across?"
    scale: [absent, borderline, present]
    sources: [stavros1995, mendelson2013, hong2005]
  # Posterior acoustic shadowing. Stavros sensitivity 48.8%, specificity 94.7%: rule-in only.
  - id: posterior_shadowing
    question: "Is tissue directly beneath a focal area darker than tissue beside it at that depth?"
    scale: [absent, mild, marked]
    sources: [stavros1995, mendelson2013, lee2017]
  # Stavros' thick echogenic halo, the sonographic form of spiculation: sensitivity 36.0% but
  # specificity 99.4%: rule-in only. A thin bright pseudocapsule counts as `absent` by wording,
  # so lesion-free and benign-lesion images both sit at the bottom.
  - id: thick_echogenic_halo
    question: "Is a broad bright rim, thicker than a fine line, present around a focal area?"
    scale: [absent, mild, marked]
    sources: [stavros1995]
  # BI-RADS associated feature: architectural distortion. Stavros' duct extension (24.8%) and
  # branch pattern (29.6%) are both minority findings with specificity above 95%: rule-in only.
  - id: tissue_plane_distortion
    question: "Are the horizontal tissue layers around a focal area pulled in or interrupted?"
    scale: [absent, mild, marked]
    sources: [stavros1995, mendelson2013, rao2016]
classes:
  # Commits on the two majority-sensitivity descriptors (shape, margin) and on the definitional
  # gate. `any` on the four high-specificity, low-sensitivity findings: the lexicon calls them
  # characteristic when present, not expected in every cancer.
  malignant:
    fingerprint:
      focal_lesion_present: present
      shape_irregularity: irregular
      margin_circumscription: angular_or_spiculated
      taller_than_wide: any
      posterior_shadowing: any
      thick_echogenic_halo: any
      tissue_plane_distortion: any
    sources: [stavros1995, mendelson2013, hong2005, rao2016]
  # MedMNIST merges BUSI's lesion-free "normal" images and its benign-lesion images into this
  # one negative class. It commits at the benign end of every descriptor scale, which is one
  # step above the `no_focal_area` / `absent` floor that a lesion-free image answers, so both
  # halves of the merged class stay nearer this fingerprint than the malignant one. Only the
  # gate stays `any`, because that is the one question the two halves genuinely answer opposite.
  "normal, benign":
    fingerprint:
      focal_lesion_present: any
      shape_irregularity: oval_or_round
      margin_circumscription: circumscribed
      taller_than_wide: absent
      posterior_shadowing: absent
      thick_echogenic_halo: absent
      tissue_plane_distortion: absent
    sources: [stavros1995, mendelson2013, hong2005, aldhabyani2020]
