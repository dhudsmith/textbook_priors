    - key: dorsi2013
      citation: >-
        D'Orsi CJ, Sickles EA, Mendelson EB, Morris EA. ACR BI-RADS Atlas, Breast Imaging
        Reporting and Data System. 5th ed. Reston, VA: American College of Radiology; 2013.
      url: https://www.acr.org/Clinical-Resources/Clinical-Tools-and-Reference/Reporting-and-Data-Systems/Bi-Rads
      used_for: [focal_lesion_present]
    - key: mendelson2013
      citation: >-
        Mendelson EB, Bohm-Velez M, Berg WA, et al. ACR BI-RADS Ultrasound. In: ACR BI-RADS
