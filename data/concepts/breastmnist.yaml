      used_for: [margin_circumscription, tissue_plane_distortion]
concepts:
  # Gate concept. Definitional for the malignant class. The negative class stays `any`: the
  # literature makes no claim about whether a "normal or benign" breast image contains a mass,
  # and MedMNIST's merge puts both answers in the same class.
  - id: focal_lesion_present
    question: "Is a discrete focal area standing out from the surrounding layered tissue visible?"
    scale: [absent, equivocal, present]
    sources: [yang2023, aldhabyani2020, dorsi2013, mendelson2013, lee2017]
    anchors:
      absent:
        text: >-
          only smooth parallel layers of fat, fibroglandular tissue and muscle, with nothing
          standing out from them
        sources: [mendelson2013, aldhabyani2020]
      # Reasoned boundary: BI-RADS calls a space-occupying lesion a mass only when it is seen
      # in two projections; a single-view finding whose border cannot be closed is the
      # equivocal case. The sources give no threshold for a single 224-pixel frame.
      equivocal:
        text: >-
          a faint textural variation whose outline cannot be traced all the way round on this
          single view
        sources: [mendelson2013, dorsi2013]
      present:
        text: >-
          a discrete area whose full outline can be traced, occupying space and pushing the
          layers aside
        sources: [mendelson2013, dorsi2013, lee2017]
  # BI-RADS shape. Microlobulation is a majority malignant finding (Stavros sensitivity 75.2%),
  # and oval shape is a majority benign finding (Hong NPV 84%), so BOTH classes commit here.
  # `no_focal_area` is the honest bottom level for a lesion-free image; it sits one step below
  # the benign level, keeping normal images nearer the negative fingerprint.
  - id: shape_irregularity
    question: "If a focal area stands out, is its outline oval, gently lobulated, or jagged?"
    scale: [no_focal_area, oval_or_round, gently_lobulated, irregular]
    sources: [stavros1995, mendelson2013, hong2005]
    anchors:
      no_focal_area:
        text: >-
          no traceable outline anywhere in the frame; the fibroglandular layers run
          uninterrupted across it
        sources: [mendelson2013]
      oval_or_round:
        text: >-
          a smooth ellipse or circle whose outline curves evenly, with no bulges and no corners
        sources: [mendelson2013, hong2005]
      gently_lobulated:
        text: >-
          two or three broad rounded bulges on an otherwise smooth ellipse, each bulge wide and
          shallow
        sources: [mendelson2013, stavros1995]
      irregular:
        text: >-
          outline neither round nor oval: jagged or angular, or studded with many tiny 1-2 mm
          lobulations
        sources: [stavros1995, mendelson2013]
  # BI-RADS margin. The single most sensitive malignant descriptor (angular margins, Stavros
  # sensitivity 83.2%) and the most reliable benign one (circumscribed margin, Hong NPV 90%),
  # so BOTH classes commit. Same `no_focal_area` floor as above.
  - id: margin_circumscription
    question: "If a focal area stands out, is its boundary sharp, blurred, or angular and spiky?"
    scale: [no_focal_area, circumscribed, indistinct, angular_or_spiculated]
    sources: [stavros1995, mendelson2013, hong2005, rao2016]
    anchors:
      no_focal_area:
        text: >-
          nothing stands out from the tissue layers, so there is no boundary anywhere to judge
        sources: [mendelson2013]
      circumscribed:
        text: >-
          the whole circumference is a sharp line with an abrupt transition to the tissue
          around it
        sources: [mendelson2013, hong2005]
      indistinct:
        text: >-
          part of the edge fades into the surrounding tissue with no sharp line separating the
          two
        sources: [mendelson2013, rao2016]
      angular_or_spiculated:
        text: >-
          the edge forms sharp corners, or fine straight lines radiate outward from it into the
          tissue
        sources: [stavros1995, mendelson2013]
  # BI-RADS orientation, framed as presence so a lesion-free image answers `absent`. Stavros
  # sensitivity 41.6% but specificity 98.1%: rule-in only, so malignant takes `any`.
  - id: taller_than_wide
    question: "Does any focal area reach deeper below the skin than it measures across?"
    scale: [absent, borderline, present]
    sources: [stavros1995, mendelson2013, hong2005]
    anchors:
      absent:
        text: >-
          width across the image clearly exceeds depth, or nothing discrete stands out to
          measure at all
        sources: [stavros1995, mendelson2013]
      # Reasoned boundary: Stavros' criterion is binary (anteroposterior dimension greater
      # than transverse), so the equal-axes case has no level of its own in the source.
      borderline:
        text: >-
          depth below the skin line and width across it look about equal, neither axis clearly
          the longer
        sources: [stavros1995]
      present:
        text: >-
          the area reaches further in depth from the skin line than it measures across, standing
          upright
        sources: [stavros1995, hong2005]
  # Posterior acoustic shadowing. Stavros sensitivity 48.8%, specificity 94.7%: rule-in only.
  - id: posterior_shadowing
    question: "Is tissue directly beneath a focal area darker than tissue beside it at that depth?"
    scale: [absent, mild, marked]
    sources: [stavros1995, mendelson2013, lee2017]
    anchors:
      absent:
        text: >-
          tissue just deep to the area is as bright as tissue at the same depth beside it
        sources: [stavros1995, mendelson2013]
      # Reasoned boundary: the sources separate thin edge shadows from true posterior
      # shadowing but grade neither, so that split is used as the mild/marked step.
      mild:
        text: >-
          narrow dark lines trail from the area's edges only; tissue directly behind it stays
          visible
        sources: [stavros1995, lee2017]
      marked:
        text: >-
          a broad dark band deep to the whole area hides the tissue behind it toward the image
          bottom
        sources: [stavros1995, lee2017]
  # Stavros' thick echogenic halo, the sonographic form of spiculation: sensitivity 36.0% but
  # specificity 99.4%: rule-in only. A thin bright pseudocapsule counts as `absent` by wording,
  # so lesion-free and benign-lesion images both sit at the bottom.
  - id: thick_echogenic_halo
    question: "Is a broad bright rim, thicker than a fine line, present around a focal area?"
    scale: [absent, mild, marked]
    sources: [stavros1995]
    anchors:
      absent:
        text: >-
          no bright rim, or only a hairline bright capsule no thicker than the surrounding
          tissue lines
        sources: [stavros1995]
      # Reasoned boundary: Stavros defines the thick halo as a single finding and gives no
      # graded scale, so partial versus full circumference is used as the mild/marked step.
      mild:
        text: >-
          a bright rim clearly thicker than a hairline but present around only part of the
          circumference
        sources: [stavros1995]
      marked:
        text: >-
          a broad bright zone right around the area, its outer edge fading gradually into
          surrounding tissue
        sources: [stavros1995]
  # BI-RADS associated feature: architectural distortion. Stavros' duct extension (24.8%) and
  # branch pattern (29.6%) are both minority findings with specificity above 95%: rule-in only.
  - id: tissue_plane_distortion
    question: "Are the horizontal tissue layers around a focal area pulled in or interrupted?"
    scale: [absent, mild, marked]
    sources: [stavros1995, mendelson2013, rao2016]
    anchors:
      absent:
        text: >-
          the horizontal tissue layers run straight past the area, neither bent toward it nor
          broken
        sources: [stavros1995, mendelson2013]
      # Reasoned boundary: the sources describe distortion as present or absent, so bent but
      # continuous layers versus frankly broken layers is used as the mild/marked step.
      mild:
        text: >-
          layers next to the area bow or angle toward it but remain continuous along their
          length
        sources: [stavros1995, rao2016]
      marked:
        text: >-
          layers are broken where they meet the area, with straight strands running radially out
          from it
        sources: [stavros1995, rao2016]
classes:
  # Commits on the two majority-sensitivity descriptors (shape, margin) and on the definitional
  # gate. `any` on the four high-specificity, low-sensitivity findings: the lexicon calls them
  # characteristic when present, not expected in every cancer.
  malignant:
    fingerprint:
      focal_lesion_present: present
      shape_irregularity: irregular
      margin_circumscription: angular_or_spiculated
      taller_than_wide: any
      posterior_shadowing: any
      thick_echogenic_halo: any
      tissue_plane_distortion: any
    sources: [stavros1995, mendelson2013, hong2005, rao2016]
  # MedMNIST merges BUSI's lesion-free "normal" images and its benign-lesion images into this
  # one negative class. It commits at the benign end of every descriptor scale, which is one
  # step above the `no_focal_area` / `absent` floor that a lesion-free image answers, so both
  # halves of the merged class stay nearer this fingerprint than the malignant one. Only the
  # gate stays `any`, because that is the one question the two halves genuinely answer opposite.
  "normal, benign":
    fingerprint:
      focal_lesion_present: any
      shape_irregularity: oval_or_round
      margin_circumscription: circumscribed
      taller_than_wide: absent
      posterior_shadowing: absent
      thick_echogenic_halo: absent
      tissue_plane_distortion: absent
    sources: [stavros1995, mendelson2013, hong2005, aldhabyani2020]
