# breastmnist concept bank
# Binary breast-ultrasound task from the BUSI dataset, as packaged by MedMNIST v2.
# Compiled 2026-09-09 by literature review; simulated expert review only (see provenance).
#
# NOTE ON THE CLASS KEYS: MedMNIST collapses BUSI's three original categories into two by
# merging the "normal" (no lesion at all) and "benign" (benign lesion) images into the single
# negative class "normal, benign", and testing them against "malignant". The negative class is
# therefore a MIXTURE of lesion-free images and images containing a benign mass. Every
# lesion-descriptor scale below carries an explicit bottom level (`no_focal_area` or `absent`)
# so that a lesion-free image has an honest answer that sits below the benign level rather
# than being undefined; that is what lets the negative class commit instead of using `any`.
#
# COMMITMENT RULE used for every fingerprint level in this file:
#   commit a class to a level only where the cited source reports that level for a MAJORITY of
#   that class (roughly, sensitivity >= 50% for the class that shows the feature, or
#   specificity >= 90% for the class that lacks it), or where the level is definitional.
#   A feature that is high-specificity but low-sensitivity ("characteristic when present, often
#   absent") is NOT the textbook expectation for the class that sometimes shows it: that class
#   gets `any`, while the class that reliably lacks it commits to the bottom level. Such a
#   concept then discriminates in the rule-in direction only, which is what the lexicon claims.
#   Sensitivities and specificities are Stavros 1995 Table 2 (read from the full text);
#   negative-class commitments additionally rest on the NPVs in Hong 2005.
#
# CONCEPT CONSIDERED AND DROPPED - internal_echo_heterogeneity (internal echo pattern /
#   echotexture). Stavros 1995 Table 1 puts BOTH "heterogeneous texture" and "homogeneous
#   texture" in its indeterminate column (a 5%-49% chance of malignancy, versus <5% for its
#   benign findings and >=50% for its malignant ones). Its results section reports
#   heterogeneous texture in 33/125 (26.4%) malignant and 137/625 (21.9%) benign nodules,
#   an odds ratio of 1.16 for heterogeneity as a malignant finding and 0.95 for homogeneity
#   as a benign one, and states that odds ratios close to 1.0 indicate little change in the
#   risk of malignancy. Hong 2005 names no echo-pattern descriptor among those it reports as
#   highly predictive (its lists are margin, shape and orientation only), though it does find
#   echo pattern significantly distributed. Under the commitment rule above neither class
#   could therefore commit, leaving an `any`/`any` concept that carries no signal. It is
#   deliberately absent, not overlooked; do not re-add it without evidence Stavros contradicts.
dataset: breastmnist
modality: 1-channel greyscale breast ultrasound images
task: binary
medmnist_task: "binary-class"
source_dataset: BUSI, Breast Ultrasound Images (Al-Dhabyani et al. 2020)
provenance:
  method: literature review with a web-connected assistant
  assistant: Claude Opus 5 (claude-opus-5), 2026-09-09
  reviewed_by: >-
    simulated review by Claude Opus 5 (claude-opus-5), 2026-09-09; no clinician has
    reviewed this file
  sources:
    - key: yang2023
      citation: >-
        Yang J, Shi R, Wei D, Liu Z, Zhao L, Ke B, Pfister H, Ni B. MedMNIST v2 - A large-scale
        lightweight benchmark for 2D and 3D biomedical image classification. Scientific Data
        2023;10:41.
      doi: 10.1038/s41597-022-01721-8
      used_for: [focal_lesion_present]
    - key: aldhabyani2020
      citation: >-
        Al-Dhabyani W, Gomaa M, Khaled H, Fahmy A. Dataset of breast ultrasound images.
        Data in Brief 2020;28:104863.
      doi: 10.1016/j.dib.2019.104863
      used_for: [focal_lesion_present]
    - key: dorsi2013
      citation: >-
        D'Orsi CJ, Sickles EA, Mendelson EB, Morris EA. ACR BI-RADS Atlas, Breast Imaging
        Reporting and Data System. 5th ed. Reston, VA: American College of Radiology; 2013.
      url: https://www.acr.org/Clinical-Resources/Clinical-Tools-and-Reference/Reporting-and-Data-Systems/Bi-Rads
      used_for: [focal_lesion_present]
    - key: mendelson2013
      citation: >-
        Mendelson EB, Bohm-Velez M, Berg WA, et al. ACR BI-RADS Ultrasound. In: ACR BI-RADS
        Atlas, Breast Imaging Reporting and Data System. 5th ed. Reston, VA: American College
