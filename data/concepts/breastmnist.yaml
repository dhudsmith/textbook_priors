      citation: >-
        Hong AS, Rosen EL, Soo MS, Baker JA. BI-RADS for sonography: positive and negative
        predictive values of sonographic features. AJR Am J Roentgenol 2005;184:1260-5.
      doi: 10.2214/ajr.184.4.01841260
      used_for: [shape_irregularity, margin_circumscription, taller_than_wide]
    - key: lee2017
      citation: >-
        Lee J. Practical and illustrated summary of updated BI-RADS for ultrasonography.
        Ultrasonography 2017;36:71-81.
      doi: 10.14366/usg.16034
