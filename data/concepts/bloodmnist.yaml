concepts:
  - id: nucleus_present
    question: "Does the cell in the centre of the image contain a nucleus, that is a distinct
      darker internal body, or is the whole cell body uniform with no nucleus at all?"
    scale: [absent, present]
    sources: [tigner2026, williams2022, constantino2000, acevedo2020, yang2023]
  - id: cell_size
    question: "How large is the central cell compared with the surrounding red blood cells:
      clearly smaller than one red cell, about the same size, or clearly larger?"
    scale: [much_smaller, similar, larger]
    sources:
      [tigner2026, espinoza2023, williams2022, chapman2023, migliaccio2010, palmer2015,
       rodellar2018, yang2023]
  - id: nuclear_lobation
    question: "What is the shape of the nucleus: no nucleus at all, a single round or oval mass,
      a single indented, kidney-shaped or band-like mass, two lobes joined by a strand, or three
      or more lobes joined by thin strands?"
    scale: [none, round, indented, bilobed, multilobed]
    sources: [tigner2026, espinoza2023, palmer2015, rodellar2018]
  - id: chromatin_density
    question: "How dense is the nuclear material: open and finely textured with pale areas,
      moderately clumped, densely clumped but with a visible coarse pattern of light and dark,
      or so uniformly dark and structureless that no internal pattern can be seen at all?"
    scale: [open_fine, moderately_clumped, dense_clumped, pyknotic_structureless]
    sources:
      [tigner2026, espinoza2023, chapman2023, migliaccio2010, constantino2000, rodellar2018]
  - id: nucleus_to_cytoplasm_ratio
    question: "About what fraction of the cell area is nucleus: less than a third (low), between
      a third and two thirds (moderate), or more than two thirds (high)?"
    scale: [low, moderate, high]
    sources: [tigner2026, espinoza2023, constantino2000, rodellar2018]
  - id: cytoplasm_basophilia
    question: "What colour is the cytoplasm around the nucleus: pink or almost colourless, pale
      grey-blue, plainly blue, or deep intense blue?"
    scale: [pink_or_colourless, pale_grey_blue, blue, deep_blue]
    sources: [tigner2026, espinoza2023, chapman2023, williams2022, rodellar2018]
  - id: granule_abundance
    question: "How prominent are granules, that is small discrete dots, in the cytoplasm: none
      visible, fine and sparse or dust-like, or coarse and abundant so that they fill the
      cytoplasm?"
    scale: [absent, fine_sparse, coarse_abundant]
    sources: [tigner2026, espinoza2023, williams2022, palmer2015, rodellar2018]
  - id: granule_colour
    question: "If granules are visible, what colour are they, from palest to darkest: none
      visible, pale lilac or neutral, orange-red, or dark purple to black?"
    scale: [none_visible, pale_neutral, orange_red, dark_purple]
    sources: [tigner2026, palmer2015, rodellar2018, acevedo2020]
  - id: granules_obscure_nucleus
    question: "Do the cytoplasmic granules lie over the nucleus and hide it: not at all, partly,
      or so completely that the nuclear outline cannot be traced?"
    scale: [absent, partial, marked]
    sources: [tigner2026]
classes:
  # Segmented neutrophil: 12-15 um, 3-5 nuclear lobes joined by thin strands, condensed
  # chromatin, pale pink cytoplasm whose specific granules are barely resolvable.
  "neutrophil":
    fingerprint:
      nucleus_present: present
      cell_size: larger
      nuclear_lobation: multilobed
      chromatin_density: dense_clumped
      nucleus_to_cytoplasm_ratio: moderate
      cytoplasm_basophilia: pink_or_colourless
      granule_abundance: fine_sparse
      granule_colour: pale_neutral
      granules_obscure_nucleus: absent
    sources: [tigner2026, palmer2015, yang2023]
  # Eosinophil: bilobed nucleus with large coarse granules staining red to pink. The bilobed
  # nucleus stays visible, which is the point of the contrast with the basophil, whose granules
  # normally hide the nucleus; tigner2026 reports obscuring only in SOME eosinophils, a minority
  # statement rather than the expectation, so this class commits to `absent`.
  "eosinophil":
    fingerprint:
      nucleus_present: present
      cell_size: larger
      nuclear_lobation: bilobed
      chromatin_density: dense_clumped
      nucleus_to_cytoplasm_ratio: moderate
      cytoplasm_basophilia: any
      granule_abundance: coarse_abundant
      granule_colour: orange_red
      granules_obscure_nucleus: absent
    sources: [tigner2026, palmer2015, yang2023]
  # Basophil: 12-15 um, bilobed or S-shaped nucleus that the coarse blue-purple to near-black
  # granules normally obscure, so nuclear shape, chromatin and cytoplasm colour are left open.
  "basophil":
    fingerprint:
      nucleus_present: present
      cell_size: larger
      nuclear_lobation: any
      chromatin_density: any
      nucleus_to_cytoplasm_ratio: any
      cytoplasm_basophilia: any
      granule_abundance: coarse_abundant
      granule_colour: dark_purple
      granules_obscure_nucleus: marked
    sources: [tigner2026, palmer2015, yang2023]
  # Erythroblast: nucleated red-cell precursor. The nucleus is round and becomes dense through
  # chromosome condensation until it is an opaque, structureless pyknotic mass, which is what
  # separates it from the merely heterochromatic lymphocyte nucleus. The precursor is larger than
  # the mature red cell it becomes, since the cell shrinks as it matures. No granules. Cytoplasm
  # runs from deeply basophilic to pinkish as haemoglobin accumulates, so its colour is left open.
  "erythroblast":
    fingerprint:
      nucleus_present: present
      cell_size: larger
      nuclear_lobation: round
      chromatin_density: pyknotic_structureless
      nucleus_to_cytoplasm_ratio: high
      cytoplasm_basophilia: any
      granule_abundance: absent
      granule_colour: none_visible
      granules_obscure_nucleus: absent
    sources: [migliaccio2010, chapman2023, constantino2000, palmer2015, yang2023]
  # Immature granulocytes: promyelocytes, myelocytes and metamyelocytes pooled, all larger than a
  # red cell. Two levels here are ORDINAL FLOORS, not modal expectations, and are marked as such:
  #   chromatin_density: open_fine is the LEAST-CONDENSED end the series reaches - chapman2023
  #     describes immature granulocytes as having large vesicular nuclei - and chromatin condenses
  #     stage by stage from there, the myelocyte, the most numerous stage, being moderately
  #     clumped. The floor is what holds the class apart from the dense-chromatin mature cells.
  #   granule_abundance: fine_sparse is the LOWEST level the series reaches, and is definitional
  #     rather than stage-dependent: every stage of the granulocytic series carries cytoplasmic
  #     granules, primary azurophilic ones from the promyelocyte and lineage-specific ones from
  #     the myelocyte on, so granules are never absent even though their size and colour vary.
  # Everything that genuinely spans the series is left open: nuclear shape runs round -> oval ->
  # indented, the N:C ratio falls, granule colour follows the lineage, and the cytoplasm runs from
  # blue through pale to pink as specific granules appear - chapman2023 calls these cells less
  # basophilic than the blasts they come from, so no single colour level holds a majority.
  "immature granulocytes(myelocytes, metamyelocytes and promyelocytes)":
    fingerprint:
      nucleus_present: present
      cell_size: larger
      nuclear_lobation: any
      chromatin_density: open_fine        # ordinal floor: least-condensed end of the series
      nucleus_to_cytoplasm_ratio: any
      cytoplasm_basophilia: any
      granule_abundance: fine_sparse      # ordinal floor: granules are never absent in this series
      granule_colour: any
      granules_obscure_nucleus: absent
    sources: [chapman2023, acevedo2020, acevedo2019, palmer2015, yang2023]
  # Small lymphocyte: about the size of a red cell, spherical heterochromatic nucleus, scant pale
  # blue cytoplasm, no visible granules.
  "lymphocyte":
    fingerprint:
      nucleus_present: present
      cell_size: similar
      nuclear_lobation: round
      chromatin_density: dense_clumped
      nucleus_to_cytoplasm_ratio: high
      cytoplasm_basophilia: blue
      granule_abundance: absent
      granule_colour: none_visible
      granules_obscure_nucleus: absent
    sources: [tigner2026, yang2023]
  # Monocyte: largest leucocyte, 12-20 um and about twice a red cell, indented, kidney-shaped or
  # C-shaped nucleus, abundant pale grey to blue cytoplasm with fine granules.
  "monocyte":
    fingerprint:
      nucleus_present: present
      cell_size: larger
      nuclear_lobation: indented
      chromatin_density: moderately_clumped
      nucleus_to_cytoplasm_ratio: low
      cytoplasm_basophilia: pale_grey_blue
      granule_abundance: fine_sparse
      granule_colour: any
      granules_obscure_nucleus: absent
    sources: [espinoza2023, tigner2026, yang2023]
  # Platelet: the smallest blood cell, about 2 um and far smaller than a red cell, anucleate,
  # discoid, staining blue with a granular appearance. Nuclear concepts do not apply.
  "platelet":
    fingerprint:
      nucleus_present: absent
      cell_size: much_smaller
      nuclear_lobation: none
      chromatin_density: any
      nucleus_to_cytoplasm_ratio: any
      cytoplasm_basophilia: blue
      granule_abundance: fine_sparse
      granule_colour: any
      granules_obscure_nucleus: absent
    sources: [williams2022, palmer2015, yang2023]
