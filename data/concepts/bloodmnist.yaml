# Concept bank for bloodmnist (MedMNIST v2), compiled 2026-09-09.
# Eight normal peripheral-blood cell types imaged one cell per frame. Concepts are purely
# morphological: is a nucleus present at all, how big the cell is against the surrounding red
# cells, nuclear lobation and chromatin, nucleus-to-cytoplasm ratio, cytoplasmic basophilia, and
# the abundance, colour and opacity of the cytoplasmic granules.
#
# HOW A FINGERPRINT LEVEL IS CHOSEN (the rule this file follows throughout).
# A class commits to a level only when the source's frequency for that class is a majority, or
# when the feature is definitional. Where a class spans a range - and one class here is a lumped
# maturation series - there are exactly two admissible moves: use `any`, or use an explicit
# ORDINAL BOUND on the ordered scale and say in the class comment that that is what the level is,
# naming the end of the range it fixes. A level is never set from the earliest, most striking or
# most memorable member of a range and then presented as the expectation.
#
# Two classes need a note. "platelet" is anucleate and only about a quarter the diameter of a red
# cell, so nucleus_present and cell_size are what isolate it. The immature-granulocyte class LUMPS
# promyelocytes, myelocytes and metamyelocytes, a maturation series over which chromatin condenses,
# nuclear shape runs round -> oval -> indented and the cytoplasm turns from blue through pale to
# pink; the source dataset kept the three stages together because the distinctions are subjective
# even for a clinical pathologist. Its fingerprint therefore uses `any` wherever the stages
# disagree, and two ordinal floors, each labelled as such in the class comment.
dataset: bloodmnist
modality: >-
  three-channel colour microscopy images of individual normal peripheral-blood cells,
  May-Grunwald-Giemsa stained, captured on a CellaVision DM96 analyser
task: multi-class
medmnist_task: "multi-class"
source_dataset: Peripheral blood cell images, Hospital Clinic of Barcelona (Acevedo et al. 2020)
provenance:
  method: literature review with a web-connected assistant
  assistant: Claude Opus 5 (claude-opus-5), 2026-09-09
  reviewed_by: >-
    simulated review by Claude Opus 5 (claude-opus-5), 2026-09-09; no clinician has
    reviewed this file
  sources:
    - key: acevedo2020
      citation: >-
        Acevedo A, Merino A, Alferez S, Molina A, Boldu L, Rodellar J. A dataset of microscopic
        peripheral blood cell images for development of automatic recognition systems.
        Data in Brief 2020;30:105474.
      doi: 10.1016/j.dib.2020.105474
      used_for: [nucleus_present, cell_size, granule_abundance, granule_colour]
    - key: acevedo2019
      citation: >-
        Acevedo A, Alferez S, Merino A, Puigvi L, Rodellar J. Recognition of peripheral blood cell
        images using convolutional neural networks. Computer Methods and Programs in Biomedicine
        2019;180:105020.
      doi: 10.1016/j.cmpb.2019.105020
      used_for: [granule_abundance, chromatin_density]
    - key: yang2023
      citation: >-
        Yang J, Shi R, Wei D, Liu Z, Zhao L, Ke B, Pfister H, Ni B. MedMNIST v2 - A large-scale
        lightweight benchmark for 2D and 3D biomedical image classification. Scientific Data
        2023;10:41.
      doi: 10.1038/s41597-022-01721-8
      used_for: [nucleus_present, cell_size]
    - key: palmer2015
      citation: >-
        Palmer L, Briggs C, McFadden S, Zini G, Burthem J, Rozenberg G, Proytcheva M, Machin SJ.
        ICSH recommendations for the standardization of nomenclature and grading of peripheral
        blood cell morphological features. International Journal of Laboratory Hematology
        2015;37:287-303.
      doi: 10.1111/ijlh.12327
      used_for:
        [cell_size, nuclear_lobation, granule_abundance, granule_colour, chromatin_density]
    - key: rodellar2018
      citation: >-
        Rodellar J, Alferez S, Acevedo A, Molina A, Merino A. Image processing and machine learning
        in the morphological analysis of blood cells. International Journal of Laboratory
        Hematology 2018;40(S1):46-53.
      doi: 10.1111/ijlh.12818
      used_for:
        [cell_size, nuclear_lobation, chromatin_density, nucleus_to_cytoplasm_ratio,
         cytoplasm_basophilia, granule_abundance, granule_colour]
    - key: tigner2026
      citation: >-
        Tigner A, Ibrahim SA, Murray IV. Histology, White Blood Cell. In: StatPearls. Treasure
        Island (FL): StatPearls Publishing; updated 14 February 2026. Bookshelf NBK563148.
      url: https://www.ncbi.nlm.nih.gov/books/NBK563148/
