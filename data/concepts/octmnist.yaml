# Concept bank for octmnist (MedMNIST v2)
# Retinal OCT B-scans; four labels: CNV, DME, drusen and normal.
# Built 2026-09-09 by literature review with a web-connected assistant.
# Expert review is SIMULATED; no clinician has signed off on this file.

dataset: octmnist
modality: 1-channel greyscale retinal optical coherence tomography (OCT) B-scans
task: multi-class
medmnist_task: "multi-class"
source_dataset: Kermany OCT dataset (Kermany et al. 2018)
