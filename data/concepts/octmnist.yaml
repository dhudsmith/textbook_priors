concepts:
  - id: retinal_layer_integrity
    question: "Are the banded retinal layers continuous and regularly stacked across the scan?"
    scale: [intact, mildly_disrupted, markedly_disrupted]
    sources: [staurenghi2014, keane2012, kermany2018, yang2023]
  - id: foveal_contour
    question: "Does the retinal surface at the centre form a smooth shallow depression?"
    scale: [normal_depression, flattened, elevated]
    sources: [staurenghi2014, otani1999, yang2023]
  - id: retinal_thickness
    question: "How thick is the retina between its inner surface and the bright outer band?"
    scale: [normal, mildly_increased, markedly_increased]
    sources: [staurenghi2014, otani1999, keane2012]
  - id: intraretinal_cystoid_spaces
    question: "Are there rounded dark low-reflectivity pockets inside the retinal layers?"
    scale: [absent, few_small, many_or_large]
    sources: [otani1999, spaide2020, kermany2018]
  - id: subretinal_fluid
    question: "Is there a dark empty space lifting the retina off the bright band beneath it?"
    scale: [absent, small, large]
    sources: [otani1999, spaide2020, keane2012]
  - id: rpe_line_contour
    question: "Is the bright outer band smooth, gently domed in small bumps, or focally lifted?"
    scale: [smooth, small_domed_undulations, large_irregular_elevation]
    sources: [khanifar2008, ferris2013, spaide2020, keane2012, staurenghi2014, kermany2018]
  - id: subretinal_hyperreflective_material
    question: "Is there bright solid-looking material between the retina and the bright outer band?"
    scale: [absent, small, extensive]
    sources: [spaide2020, keane2012, ferris2013, kermany2018]
  - id: hyperreflective_foci
    question: "Are there small bright dots or specks scattered within the darker retinal layers?"
    scale: [absent, few, many]
    sources: [bolz2009, spaide2020, khanifar2008]
  - id: shadowing_beneath_lesion
    question: "Do bright structures cast vertical dark columns into the tissue beneath them?"
    scale: [absent, mild, marked]
    sources: [bolz2009, khanifar2008, keane2012]

classes:
  "choroidal neovascularization":
    fingerprint:
      retinal_layer_integrity: markedly_disrupted
      foveal_contour: elevated
      retinal_thickness: mildly_increased
      intraretinal_cystoid_spaces: few_small
      subretinal_fluid: large
      rpe_line_contour: large_irregular_elevation
      subretinal_hyperreflective_material: extensive
      hyperreflective_foci: any
      shadowing_beneath_lesion: marked
    sources: [spaide2020, keane2012, kermany2018]
  "diabetic macular edema":
    fingerprint:
      retinal_layer_integrity: mildly_disrupted
      foveal_contour: elevated
      retinal_thickness: markedly_increased
      intraretinal_cystoid_spaces: many_or_large
      subretinal_fluid: any
      rpe_line_contour: smooth
      subretinal_hyperreflective_material: absent
      hyperreflective_foci: many
      shadowing_beneath_lesion: mild
    sources: [otani1999, bolz2009, kermany2018]
  "drusen":
    fingerprint:
      retinal_layer_integrity: intact
      foveal_contour: normal_depression
      retinal_thickness: normal
      intraretinal_cystoid_spaces: absent
      subretinal_fluid: absent
      rpe_line_contour: small_domed_undulations
      subretinal_hyperreflective_material: absent
      hyperreflective_foci: any
      shadowing_beneath_lesion: any
    sources: [ferris2013, khanifar2008, keane2012]
  "normal":
    fingerprint:
      retinal_layer_integrity: intact
      foveal_contour: normal_depression
      retinal_thickness: normal
      intraretinal_cystoid_spaces: absent
      subretinal_fluid: absent
      rpe_line_contour: smooth
      subretinal_hyperreflective_material: absent
      hyperreflective_foci: absent
      shadowing_beneath_lesion: absent
    sources: [staurenghi2014, kermany2018]
