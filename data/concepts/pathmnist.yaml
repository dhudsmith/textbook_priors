# Concept bank: pathmnist (MedMNIST v2)
# H&E-stained colorectal cancer histology patches, nine tissue classes.
# Compiled 2026-09-09 by literature review; expert review is SIMULATED (see provenance).

dataset: pathmnist
modality: >-
  haematoxylin-and-eosin-stained colorectal histology patches, 3-channel colour,
  224 x 224 pixels at about 0.5 microns per pixel
task: multi-class
medmnist_task: "multi-class"
source_dataset: NCT-CRC-HE-100K (Kather et al. 2019)
provenance:
  method: literature review with a web-connected assistant
  assistant: Claude Opus 5 (claude-opus-5), 2026-09-09
  reviewed_by: >-
    simulated review by Claude Opus 5 (claude-opus-5), 2026-09-09; no clinician has
    reviewed this file
  sources:
    - key: yang2023
      citation: >-
        Yang J, Shi R, Wei D, Liu Z, Zhao L, Ke B, Pfister H, Ni B. MedMNIST v2 - A large-scale
        lightweight benchmark for 2D and 3D biomedical image classification. Scientific Data
        2023;10:41.
      doi: 10.1038/s41597-022-01721-8
      used_for: [tissue_content]
    - key: kather2019
      citation: >-
        Kather JN, Krisam J, Charoentong P, Luedde T, Herpel E, et al. Predicting survival from
        colorectal cancer histology slides using deep learning: a retrospective multicenter study.
        PLoS Medicine 2019;16(1):e1002730.
      doi: 10.1371/journal.pmed.1002730
      used_for: [tissue_content, nuclear_density, nuclear_pleomorphism, gland_regularity,
                 fibre_alignment]
    - key: kather2016
      citation: >-
        Kather JN, Weis CA, Bianconi F, Melchers SM, Schad LR, Gaiser T, Marx A, Zollner FG.
        Multi-class texture analysis in colorectal cancer histology.
        Scientific Reports 2016;6:27988.
      doi: 10.1038/srep27988
      used_for: [tissue_content, extracellular_mucin, fat_vacuoles, small_round_cell_infiltrate,
                 necrotic_debris]
    - key: fleming2012
      citation: >-
        Fleming M, Ravula S, Tatishchev SF, Wang HL. Colorectal carcinoma: pathologic aspects.
        Journal of Gastrointestinal Oncology 2012;3(3):153-73.
      doi: 10.3978/j.issn.2078-6891.2012.030
      used_for: [nuclear_pleomorphism, gland_formation, gland_regularity, goblet_cells,
