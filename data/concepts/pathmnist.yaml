      doi: 10.1016/j.ejca.2005.07.017
      used_for: [small_round_cell_infiltrate]
    - key: pollheimer2010
      citation: >-
        Pollheimer MJ, Kornprat P, Lindtner RA, Harbaum L, Schlemmer A, Rehak P, Langner C.
