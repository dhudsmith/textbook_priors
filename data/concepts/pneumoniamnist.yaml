concepts:
  # Gate concept. WHO reference reading calls a film unremarkable only when no consolidation,
  # no other infiltrate and no pleural fluid is present; Fleischner defines "opacity" as any
  # area that attenuates the beam more than its surroundings.
  - id: parenchymal_opacity
    question: "Is any part of either lung field whiter than the surrounding dark, air-filled
      lung?"
    scale: [absent, subtle, definite]
    sources: [yang2023, kermany2018, who2001, cherian2005, fancourt2017, hansell2008,
              bradley2011, andronikou2017]
  # WHO consolidation occupies "a portion or whole of a lobe or of the entire lung"; WHO
  # "other infiltrate" instead involves both lungs, but also admits "minor patchy
  # infiltrates that are not of sufficient magnitude to constitute primary endpoint
  # consolidation". Neither category admits a film with no opacity at all, so `none` is
  # excluded for the positive class and the union's floor is the minor-patchy level.
  - id: opacity_extent
    question: "How much of the combined lung area is taken up by whiter, less dark regions?"
    scale: [none, small_patch, lobe_sized, most_of_both_lungs]
    sources: [who2001, cherian2005, fancourt2017, bradley2011]
  # Fleischner: consolidation is a homogeneous increase in attenuation that OBSCURES the
  # margins of vessels and airway walls; ground-glass opacity is a smaller increase in which
  # those margins are still visible. WHO wording for consolidation is "dense or fluffy",
  # while "other infiltrate" is still described as linear and patchy DENSITIES. Both arms
  # therefore carry at least the hazy level; only `none` is excluded, and the dense top
  # level is not.
  - id: opacity_density
    question: "Where the lung looks whiter, are the fine vessel lines still visible through it,
      or completely hidden by solid whiteness?"
    scale: [none, hazy_lines_visible, solid_lines_hidden]
    sources: [who2001, cherian2005, fancourt2017, hansell2008, andronikou2017]
  # WHO "other infiltrate": linear and patchy densities in a lacy pattern involving both
  # lungs. Fleischner: a reticular pattern is innumerable small linear opacities that by
  # summation resemble a net.
  - id: linear_streaky_markings
    question: "Are fine linear, streaky or net-like white lines spread through both lung fields?"
    scale: [absent, mild, marked]
    sources: [who2001, cherian2005, fancourt2017, hansell2008, andronikou2017]
  # Fleischner: air-filled (dark) bronchi on a background of opaque airless lung. WHO says
  # consolidation "may or may not contain air bronchograms", so the positive class does not
  # commit; but the sign does not occur in a well-aerated film, so the negative class does.
  - id: air_bronchogram
    question: "Inside a whiter region, are branching dark tube-like lines visible against the
      white?"
    scale: [absent, present]
    sources: [who2001, cherian2005, fancourt2017, hansell2008]
  # WHO "other infiltrate" explicitly features peribronchial thickening; on a frontal film
  # this reads as coarse, cuffed or ring-shaped markings radiating from the hila.
  - id: peribronchial_thickening
    question: "Around the central root of each lung, do the branching markings look thickened,
      cuffed or ring-shaped rather than fine and tapering?"
    scale: [absent, mild, marked]
    sources: [who2001, cherian2005, fancourt2017]
  # Fleischner silhouette sign: absence of depiction of an anatomic soft-tissue border,
  # caused by consolidation or atelectasis of the adjacent lung. Restricted here to the
  # LOWER cardiac edge and the hemidiaphragms; the upper mediastinum is excluded because a
  # broad thymic silhouette is expected at one to five years of age.
  - id: border_obscuration
    question: "Is the outline of the lower heart edge, or of either dome of the diaphragm,
      blurred or lost where lung meets it?"
    scale: [absent, partial, complete]
    sources: [hansell2008, fancourt2017]
  # WHO pleural effusion: fluid in the lateral pleural space, in most cases seen at the
  # costophrenic angle. Effusion is one of the two components of the WHO primary endpoint,
  # so the positive class admits it, but it complicates only a minority of cases.
  - id: costophrenic_angle_blunting
    question: "Is either lower outer angle between the diaphragm and the chest wall filled in
      or rounded rather than a sharp point?"
    scale: [absent, mild, marked]
    sources: [who2001, cherian2005, fancourt2017, bradley2011, andronikou2017]
classes:
  # WHO reference reading: a film is read as unremarkable when there is no consolidation,
  # no other infiltrate and no pleural fluid. Every concept above is worded so that such a
  # film sits at the bottom of its scale.
  normal:
    fingerprint:
      parenchymal_opacity: absent
      opacity_extent: none
      opacity_density: none
      linear_streaky_markings: absent
      air_bronchogram: absent
      peribronchial_thickening: absent
      border_obscuration: absent
      costophrenic_angle_blunting: absent
    sources: [who2001, cherian2005, fancourt2017, hansell2008, kermany2018]
  # Union of the two WHO positive categories, set by the floor rule described in the header.
  # Committed (the sources exclude the unremarkable film's level on these three):
  #   parenchymal_opacity   - both categories require an opacity to be present at all.
  #   opacity_extent        - `none` is excluded by both categories; the floor is the
  #                           "minor patchy infiltrate" clause of "other infiltrate", so
  #                           `small_patch` is a lower bound, not a claim that the class is
  #                           never lobar or never bilateral.
  #   opacity_density       - `none` is excluded; consolidation is "dense or fluffy" and
  #                           "other infiltrate" is still linear and patchy densities, so
  #                           `hazy_lines_visible` is the floor and the solid level is not
  #                           excluded.
  # Not committed (a source clause explicitly permits the low end for one arm, so the level
  # cannot be distinguished from an unremarkable film):
  #   linear_streaky_markings   - lacy bilateral lines define "other infiltrate" only; a
  #                               lobar consolidation need show none (fancourt2017).
  #   air_bronchogram           - WHO consolidation "may or may not contain air
  #                               bronchograms" (cherian2005, fancourt2017).
  #   peribronchial_thickening  - listed as a feature of "other infiltrate" only; it is not
  #                               part of the consolidation definition, and no verified
  #                               source claims it across both arms. Radiography cannot say
  #                               which arm a given film belongs to (bradley2011,
  #                               andronikou2017), so this stays open.
  #   border_obscuration        - the silhouette sign follows consolidation or atelectasis
  #                               of adjacent lung (hansell2008); a lacy bilateral pattern
  #                               need not blur any border.
  #   costophrenic_angle_blunting - pleural fluid is a separate WHO finding and a
  #                               complication of a minority of cases (andronikou2017).
  pneumonia:
    fingerprint:
      parenchymal_opacity: definite
      opacity_extent: small_patch
      opacity_density: hazy_lines_visible
      linear_streaky_markings: any
      air_bronchogram: any
      peribronchial_thickening: any
      border_obscuration: any
      costophrenic_angle_blunting: any
    sources: [who2001, cherian2005, fancourt2017, hansell2008, bradley2011, andronikou2017,
              kermany2018]
