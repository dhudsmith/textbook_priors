# pneumoniamnist concept bank
# Binary paediatric chest-radiograph task from the Kermany et al. 2018 collection, as
# packaged by MedMNIST v2.
# Compiled 2026-09-09 by literature review; simulated expert review only (see provenance).
# NOTE: the source collection lumps bacterial and viral disease into the single positive
# label "pneumonia". The positive fingerprint below is therefore a UNION expectation -
# a lobar/segmental dense consolidation OR a diffuse bilateral interstitial and
# peribronchial pattern - and the literature commits to neither arm for the class as a
# whole. Radiography is explicitly held to be too insensitive to separate bacterial from
# viral aetiology (bradley2011, andronikou2017), so the fingerprint deliberately does not
# over-commit to lobar consolidation.
# HOW THE POSITIVE FINGERPRINT WAS SET. The two WHO categories that make up the label are
# "consolidation" (a dense or fluffy opacity occupying a portion or whole of a lobe or of
# the entire lung, which may or may not contain air bronchograms) and "other infiltrate"
# (linear and patchy densities in a lacy pattern involving both lungs, featuring
# peribronchial thickening and multiple areas of atelectasis, and also including minor
# patchy infiltrates too small to constitute primary-endpoint consolidation)
# (who2001, cherian2005, fancourt2017). For each concept the union of those two
# definitions was taken and its LOWEST guaranteed level on that concept's ordered scale
# read off. Where that floor lies strictly above the level the same sources assign to an
# unremarkable film, the floor is stated as the fingerprint level: it is what the sources
# actually exclude, and on an ordered scale a film from either arm remains nearer to it
# than to the negative fingerprint. Where the floor coincides with the unremarkable
# film's level - because one arm may show nothing at all on that concept - the sources
# exclude nothing and the value is `any`. Three concepts commit, five do not; the comment
# on each `any` names the clause that permits the low end.
# NOTE: the subjects are children aged one to five years. No adult cardiothoracic-ratio
# criterion is used, and no concept below is tripped by a broad thymic silhouette, which
# is a normal finding at this age: the border-obscuration concept asks only about the
# lower cardiac edge and the hemidiaphragms, never the upper mediastinum.
dataset: pneumoniamnist
modality: 1-channel greyscale paediatric frontal chest radiographs
task: binary
medmnist_task: "binary-class"
source_dataset: Paediatric chest X-ray collection (Kermany et al. 2018)
